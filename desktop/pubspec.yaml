name: wtv
description: "WTV for the desktop"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  http: ^1.6.0
  intl: any
  material_ui: ^1.1.0
  media_kit: ^1.2.6
  media_kit_libs_linux: ^1.2.1
  media_kit_libs_macos_video: ^1.1.4
  media_kit_video: ^2.0.1
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    # TMDB's official "blue short" logo, required by TMDB's API terms (Settings → About).
    - assets/tmdb_logo.png
  # Builds lib/l10n/app_localizations*.dart from the ARB files.
  generate: true

# media_kit_video 2.0.1 with one fix for Linux: software-drawn frames are copied under
# mpv's lock before Flutter uploads them, so fast motion no longer tears
# (third_party/media_kit_video/linux/texture_sw.cc, "WTV patch").
dependency_overrides:
  media_kit_video:
    path: third_party/media_kit_video
