name: wtv
description: "WTV for the desktop"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  http: ^1.6.0
  intl: any
  material_ui: ^1.1.0
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # Builds lib/l10n/app_localizations*.dart from the ARB files.
  generate: true
